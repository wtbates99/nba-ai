[project]
name = "nba-ai"
version = "0.1.0"
description = "Predict NBA game winners from box scores, player ratings and schedule"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.9",
    "nba_api>=1.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pdfplumber>=0.11.10",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.5",
]

[project.scripts]
nba-ai = "nba_ai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nba_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=9.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.mypy.overrides]]
module = ["nba_api.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
