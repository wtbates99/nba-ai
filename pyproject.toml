[project]
name = "nba-ai"
version = "0.1.0"
description = "Learn to train models on NBA data: MLP vs transformer predicting next-game points"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.9",
    "nba_api>=1.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.mypy.overrides]]
module = ["nba_api.*"]
ignore_missing_imports = true
